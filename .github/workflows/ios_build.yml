name: iOS Release & Sideload Build (App Store & iPhone 13 Pro)

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-ios:
    name: Build Production iOS IPA
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup Flutter Stable Environment
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Verify Environment & Tools
        run: flutter doctor -v

      - name: Install Project Dependencies
        run: flutter pub get

      - name: Ensure Model Asset Placeholders Exist
        run: |
          mkdir -p assets/models/gemma assets/models/asr assets/models/tts
          [ -f assets/models/gemma/gemma-4-E2B-it.litertlm ] || touch assets/models/gemma/gemma-4-E2B-it.litertlm
          [ -f assets/models/asr/indic_conformer_int8.onnx ] || touch assets/models/asr/indic_conformer_int8.onnx
          [ -f assets/models/tts/kokoro_int8_fp16.litertlm ] || touch assets/models/tts/kokoro_int8_fp16.litertlm

      - name: Run Flutter Automated Test Suite
        run: flutter test

      - name: Build iOS Application (Release, Unsigned)
        run: |
          flutter build ios --release --no-codesign

      - name: Package Payload into Installable IPA
        run: |
          mkdir -p build/ios/iphoneos/Payload
          cp -r build/ios/iphoneos/Runner.app build/ios/iphoneos/Payload/
          cd build/ios/iphoneos
          zip -qr mobile_language_app.ipa Payload
          cd ../../..

      - name: Upload iOS IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BoliXR-Companion-iOS-Release
          path: build/ios/iphoneos/mobile_language_app.ipa
          retention-days: 14

      # =========================================================================
      # Production App Store & Sideload Distribution Notes:
      # =========================================================================
      # 1. Direct iPhone 13 Pro Sideload:
      #    - Download 'BoliXR-Companion-iOS-Release' artifact.
      #    - Connect iPhone 13 Pro via USB, open Sideloadly or AltStore, drag & drop IPA.
      #    - Sideload directly to test on-device camera, AVSpeech audio, and pipeline.
      # 2. Apple App Store / TestFlight Release:
      #    - Supply APPLE_CERTIFICATE_BASE64, APPLE_PROVISIONING_PROFILE_BASE64, and
      #      APP_STORE_CONNECT_API_KEY secrets to auto-sign and upload via fastlane/xcrun.
